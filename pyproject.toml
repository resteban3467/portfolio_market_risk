[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_market_risk"
version = "0.1.0"
description = "Sistema de monitoreo de riesgo de mercado de portafolio con VaR, CVaR y volatilidad condicional EWMA."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "alpaca-trade-api",
    "python-dotenv",
    "pyarrow",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
